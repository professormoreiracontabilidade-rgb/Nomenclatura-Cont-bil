<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Figurinhas de Contabilidade - Professor Moreira</title><style>*{box-sizing:border-box}body{margin:0;background:#ffcb00;color:#1c1c1c;font-family:Arial,sans-serif;min-height:100dvh;display:grid;place-items:center}.wrap{width:min(100%,720px);padding:12px;text-align:center}h1{font-size:clamp(18px,3.5vw,29px);margin:9px 0}h2{font-size:clamp(17px,3vw,23px);margin:7px 0 15px}.pic{max-height:76dvh;width:100%;object-fit:contain;background:#ffda33;border-radius:25px;box-shadow:0 8px 30px #95600055;touch-action:pan-y}.controls{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}button{border:0;border-radius:18px;padding:15px 18px;font-size:18px;font-weight:bold;color:#171717;background:#fff;cursor:pointer}button:active{transform:scale(.97)}#count{font-weight:bold;font-size:19px}.hint{font-size:14px;margin-top:10px}</style></head><body><main class="wrap"><h1>CURSO DE CONTABILIDADE PROFESSOR MOREIRA</h1><h2 id="title">Figurinhas de Contabilidade</h2><img class="pic" id="pic" alt="Figurinha de contabilidade"><div class="controls"><button id="prev" aria-label="Anterior">❮ Voltar</button><span id="count"></span><button id="next" aria-label="Próxima">Avançar ❯</button></div><p class="hint">Arraste para os lados ou use as setas do teclado.</p></main><script>const slides=[{"file": "01_ativo.png", "title": "Ativo"}, {"file": "02_passivo.png", "title": "Passivo"}, {"file": "03_patrimonio_liquido.png", "title": "Patrimônio Líquido"}, {"file": "04_receita.png", "title": "Receita"}, {"file": "05_despesa.png", "title": "Despesa"}, {"file": "06_regime_de_competencia.png", "title": "Regime de Competência"}, {"file": "07_ativo_imobilizado.png", "title": "Ativo Imobilizado"}, {"file": "08_depreciacao.png", "title": "Depreciação"}, {"file": "09_estoques.png", "title": "Estoques"}, {"file": "10_provisões.png", "title": "Provisões"}, {"file": "11_ativo_intangivel.png", "title": "Ativo Intangível"}, {"file": "12_reducao_ao_valor_recuperavel.png", "title": "Redução ao Valor Recuperável"}, {"file": "13_propriedade_para_investimento.png", "title": "Propriedade para Investimento"}, {"file": "14_demonstracões_contabeis.png", "title": "Demonstrações Contábeis"}];let i=0;const pic=document.getElementById('pic');function show(){pic.src=slides[i].file;pic.alt=slides[i].title;document.getElementById('title').textContent=slides[i].title;document.getElementById('count').textContent=(i+1)+' / '+slides.length;localStorage.setItem('moreira_carrossel_figurinhas',i)}function move(d){i=(i+d+slides.length)%slides.length;show()}document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.onkeydown=e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)};let x=0;pic.addEventListener('touchstart',e=>x=e.changedTouches[0].screenX,{passive:true});pic.addEventListener('touchend',e=>{let d=e.changedTouches[0].screenX-x;if(Math.abs(d)>55)move(d<0?1:-1)},{passive:true});i=Math.min(slides.length-1,Math.max(0,Number(localStorage.getItem('moreira_carrossel_figurinhas'))||0));show();</script></body></html>
